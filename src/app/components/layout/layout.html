
<div class="flex flex-col min-h-screen bg-neutral-900 text-gray-100 font-sans">

  <!-- Barra Superior -->
  <header class="sticky top-0 z-50 bg-neutral-900/95 backdrop-blur-md border-b border-[#D4AF37]/50 shadow-lg">
    <div class="max-w-7xl mx-auto flex items-center justify-between h-16 px-4 sm:px-6 lg:px-8">

      <!-- Left: Logo / Brand & Section Title -->
      <div class="flex items-center gap-3 min-w-0">
        <a (click)="goToHome()" class="flex items-center gap-2 cursor-pointer shrink-0">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-[#D4AF37] to-amber-700 flex items-center justify-center text-neutral-950 font-black text-base shadow-md">
            🎦
          </div>
          <span class="text-xl font-black tracking-wider text-[#D4AF37] hover:text-[#b8952b] transition-colors">CineIV</span>
        </a>
        <span class="hidden sm:inline text-neutral-600 font-light">|</span>
        <h1 class="text-xs sm:text-sm md:text-base font-bold text-gray-200 tracking-wide truncate">
          {{ sectionTitle() }}
        </h1>
      </div>

      <!-- Right: Auth Button (Conectarse / Desconectarse - Sin Rol) -->
      <div class="flex items-center gap-2 shrink-0">
        @if (!authService.isAuthenticated()) {
          <button
            type="button"
            (click)="goToRegister()"
            class="px-3 py-1.5 sm:px-3.5 sm:py-2 border border-[#D4AF37] hover:bg-[#D4AF37]/15 text-[#D4AF37] hover:text-[#f7d666] font-bold text-xs sm:text-sm rounded-xl shadow-md transition-all duration-200 cursor-pointer flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
            </svg>
            <span>Registrarse</span>
          </button>
          <button
            type="button"
            (click)="goToLogin()"
            class="px-3.5 py-1.5 sm:px-4 sm:py-2 bg-[#D4AF37] hover:bg-[#b8952b] text-neutral-950 font-bold text-xs sm:text-sm rounded-xl shadow-md transition-all duration-200 cursor-pointer flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
            </svg>
            <span>Conectarse</span>
          </button>
        } @else {
          <button
            type="button"
            (click)="logout()"
            class="px-3.5 py-1.5 sm:px-4 sm:py-2 bg-red-600/90 hover:bg-red-600 text-white font-semibold text-xs sm:text-sm rounded-xl shadow-md transition-all duration-200 cursor-pointer flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
            <span>Desconectarse</span>
          </button>
        }
      </div>

    </div>
  </header>

  <!-- Contenedor Principal -->
  <main class="grow pb-20 overflow-y-auto">
    <router-outlet></router-outlet>
  </main>

  <!-- Barra Inferior -->
  <nav class="fixed bottom-0 w-full bg-neutral-900/95 backdrop-blur-md border-t border-neutral-700/80 z-50">
    <div class="flex justify-around items-center h-16 max-w-md mx-auto">

      <!-- Botón Lupa (Búsqueda) - Solo para clientes o no registrados -->
      @if (!authService.currentUser() || authService.currentUser()?.rol === 'cliente') {
        <button
          (click)="goToSearch()"
          [class]="currentUrl().includes('busqueda') || currentUrl().includes('buscar')
            ? 'flex flex-col items-center justify-center w-full h-full text-[#D4AF37] cursor-pointer'
            : 'flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-[#D4AF37] transition-colors cursor-pointer'">
          <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
          <span class="text-[10px] font-medium">Buscar</span>
        </button>
      }

      <!-- Botón Casa (Inicio) -->
      <button
        (click)="goToHome()"
        [class]="currentUrl() === '/' || currentUrl() === ''
          ? 'flex flex-col items-center justify-center w-full h-full text-[#D4AF37] cursor-pointer'
          : 'flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-[#D4AF37] transition-colors cursor-pointer'">
        <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
        </svg>
        <span class="text-[10px] font-medium">Inicio</span>
      </button>

      <!-- Botón Persona (Perfil) -->
      <button
        (click)="goToProfile()"
        class="flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-[#D4AF37] transition-colors cursor-pointer">
        <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
        <span class="text-[10px] font-medium">Perfil</span>
      </button>

    </div>
  </nav>

</div>
