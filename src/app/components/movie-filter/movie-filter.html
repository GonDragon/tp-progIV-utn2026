<div class="w-full bg-neutral-800/80 backdrop-blur-md rounded-2xl border border-neutral-700/80 p-5 shadow-lg">
  <!-- Search Input Bar -->
  <div class="relative w-full mb-4">
    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
      <svg class="w-5 h-5 text-[#D4AF37]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    </div>
    <input
      type="text"
      [value]="searchQuery()"
      (input)="onSearchInput($event)"
      placeholder="Buscar por título o sinopsis de la película..."
      class="w-full pl-11 pr-10 py-3 bg-neutral-900/90 text-white placeholder-gray-400 rounded-xl border border-neutral-700 focus:outline-none focus:border-[#D4AF37] focus:ring-1 focus:ring-[#D4AF37] transition-all text-sm md:text-base shadow-inner"
    />
    @if (searchQuery()) {
      <button
        type="button"
        (click)="searchChange.emit('')"
        class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-white cursor-pointer"
        title="Borrar búsqueda">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    }
  </div>

  <!-- Genre Filter Section -->
  <div>
    <div class="flex items-center justify-between mb-2.5">
      <span class="text-xs font-semibold uppercase tracking-wider text-gray-300 flex items-center gap-1.5">
        <svg class="w-4 h-4 text-[#D4AF37]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
        </svg>
        Filtrar por Género (puedes seleccionar múltiples):
      </span>

      @if (selectedGenres().length > 0 || searchQuery().length > 0) {
        <button
          type="button"
          (click)="onClear()"
          class="text-xs text-[#D4AF37] hover:underline flex items-center gap-1 cursor-pointer">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          Restablecer
        </button>
      }
    </div>

    <!-- Genre Pill Badges -->
    <div class="flex flex-wrap gap-2">
      @for (genre of genres(); track genre) {
        <button
          type="button"
          (click)="onToggleGenre(genre)"
          [class]="isGenreSelected(genre)
            ? 'px-3 py-1.5 rounded-full text-xs font-bold transition-all duration-200 cursor-pointer border flex items-center gap-1 bg-[#D4AF37] text-neutral-950 border-[#D4AF37] shadow-md'
            : 'px-3 py-1.5 rounded-full text-xs font-medium transition-all duration-200 cursor-pointer border flex items-center gap-1 bg-neutral-900 text-gray-300 border-neutral-700 hover:border-amber-400 hover:text-white'">
          @if (isGenreSelected(genre)) {
            <svg class="w-3.5 h-3.5 text-neutral-950" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
            </svg>
          }
          {{ genre }}
        </button>
      }
    </div>
  </div>
</div>
