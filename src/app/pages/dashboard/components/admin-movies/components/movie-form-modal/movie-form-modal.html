<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 overflow-y-auto">
  <div class="bg-neutral-900 border border-neutral-700 rounded-2xl max-w-xl w-full p-6 shadow-2xl space-y-5 my-8">

    <div class="flex items-center justify-between border-b border-neutral-800 pb-3">
      <h3 class="text-lg font-bold text-white flex items-center gap-2">
        <span>🎬</span> {{ movie() ? 'Editar Película' : 'Nueva Película' }}
      </h3>
      <button
        type="button"
        (click)="onCancel()"
        class="text-gray-400 hover:text-white cursor-pointer text-lg">✕</button>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <!-- Title -->
      <div>
        <label class="block text-xs font-semibold text-gray-300 mb-1">Nombre / Título *</label>
        <input
          type="text"
          name="title"
          [(ngModel)]="movieTitle"
          required
          placeholder="Ej. Interstellar 2"
          class="w-full px-3.5 py-2.5 bg-neutral-800 border border-neutral-700 rounded-xl text-white text-sm focus:outline-none focus:border-[#D4AF37]" />
      </div>

      <!-- Synopsis -->
      <div>
        <label class="block text-xs font-semibold text-gray-300 mb-1">Sinopsis</label>
        <textarea
          name="synopsis"
          [(ngModel)]="movieSynopsis"
          rows="3"
          placeholder="Breve resumen de la trama..."
          class="w-full px-3.5 py-2.5 bg-neutral-800 border border-neutral-700 rounded-xl text-white text-sm focus:outline-none focus:border-[#D4AF37]"></textarea>
      </div>

      <!-- Duration & Age Rating -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">Duración (minutos) *</label>
          <input
            type="number"
            name="duration"
            [(ngModel)]="movieDuration"
            min="30"
            max="300"
            class="w-full px-3.5 py-2.5 bg-neutral-800 border border-neutral-700 rounded-xl text-white text-sm focus:outline-none focus:border-[#D4AF37]" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">Restricción de Edad *</label>
          <select
            name="ageRestriction"
            [(ngModel)]="movieAgeRestriction"
            class="w-full px-3.5 py-2.5 bg-neutral-800 border border-neutral-700 rounded-xl text-white text-sm focus:outline-none focus:border-[#D4AF37]">
            <option value="ATP">ATP (Apta para Todo Público)</option>
            <option value="+13">+13 (Mayores de 13 años)</option>
            <option value="+18">+18 (Exclusiva Mayores de 18 años)</option>
            <option value="Ninguna">Ninguna</option>
          </select>
        </div>
      </div>

      <!-- Poster Upload Component (Supabase Storage Bucket: images) -->
      <app-poster-upload [(imageUrl)]="movieImageUrl" />

      <!-- Genres Selection -->
      <div>
        <label class="block text-xs font-semibold text-gray-300 mb-1.5">Géneros (selección múltiple)</label>
        <div class="flex flex-wrap gap-1.5">
          @for (genre of availableGenres(); track genre) {
            <button
              type="button"
              (click)="toggleGenre(genre)"
              class="px-2.5 py-1 rounded-lg text-xs font-medium transition-all cursor-pointer border"
              [class.bg-[#D4AF37]]="selectedGenres.includes(genre)"
              [class.text-neutral-950]="selectedGenres.includes(genre)"
              [class.border-[#D4AF37]]="selectedGenres.includes(genre)"
              [class.bg-neutral-800]="!selectedGenres.includes(genre)"
              [class.text-gray-300]="!selectedGenres.includes(genre)"
              [class.border-neutral-700]="!selectedGenres.includes(genre)">
              {{ genre }}
            </button>
          }
        </div>
      </div>

      <div class="flex justify-end gap-3 pt-3 border-t border-neutral-800">
        <button
          type="button"
          (click)="onCancel()"
          [disabled]="isSaving()"
          class="px-4 py-2 bg-neutral-800 hover:bg-neutral-700 text-gray-300 text-sm font-semibold rounded-xl cursor-pointer disabled:opacity-50">
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="!movieTitle.trim() || isSaving()"
          class="px-5 py-2 bg-[#D4AF37] hover:bg-[#b8972e] text-neutral-950 text-sm font-bold rounded-xl shadow-md transition-all cursor-pointer disabled:opacity-50 flex items-center gap-2">
          @if (isSaving()) {
            <div class="w-4 h-4 border-2 border-neutral-950 border-t-transparent rounded-full animate-spin"></div>
            <span>Guardando...</span>
          } @else {
            <span>{{ movie() ? 'Guardar Cambios' : 'Crear Película' }}</span>
          }
        </button>
      </div>
    </form>

  </div>
</div>
