<div class="grid grid-cols-2 lg:grid-cols-4 gap-3.5">
  <!-- Total Logs -->
  <div class="bg-neutral-800/80 p-4 rounded-2xl border border-neutral-700/80 flex items-center gap-3.5">
    <div class="w-11 h-11 rounded-xl bg-[#D4AF37]/15 border border-[#D4AF37]/30 flex items-center justify-center text-xl shrink-0 font-bold text-[#D4AF37]">
      📜
    </div>
    <div class="min-w-0">
      <p class="text-[11px] font-medium text-neutral-400 uppercase tracking-wider">Total Registros</p>
      <h3 class="text-xl font-black text-white tracking-tight">{{ stats().totalLogs }}</h3>
      <p class="text-[10px] text-neutral-400">En base de datos</p>
    </div>
  </div>

  <!-- Admin Logs -->
  <div class="bg-neutral-800/80 p-4 rounded-2xl border border-neutral-700/80 flex items-center gap-3.5">
    <div class="w-11 h-11 rounded-xl bg-amber-500/15 border border-amber-500/30 flex items-center justify-center text-xl shrink-0 font-bold text-amber-400">
      👑
    </div>
    <div class="min-w-0">
      <p class="text-[11px] font-medium text-neutral-400 uppercase tracking-wider">Administradores</p>
      <h3 class="text-xl font-black text-amber-400 tracking-tight">{{ stats().adminLogs }}</h3>
      <p class="text-[10px] text-neutral-400">Acciones ejecutadas</p>
    </div>
  </div>

  <!-- Employee Logs -->
  <div class="bg-neutral-800/80 p-4 rounded-2xl border border-neutral-700/80 flex items-center gap-3.5">
    <div class="w-11 h-11 rounded-xl bg-blue-500/15 border border-blue-500/30 flex items-center justify-center text-xl shrink-0 font-bold text-blue-400">
      🎫
    </div>
    <div class="min-w-0">
      <p class="text-[11px] font-medium text-neutral-400 uppercase tracking-wider">Empleados / Staff</p>
      <h3 class="text-xl font-black text-blue-400 tracking-tight">{{ stats().employeeLogs }}</h3>
      <p class="text-[10px] text-neutral-400">Validaciones & operaciones</p>
    </div>
  </div>

  <!-- Today Logs -->
  <div class="bg-neutral-800/80 p-4 rounded-2xl border border-neutral-700/80 flex items-center gap-3.5">
    <div class="w-11 h-11 rounded-xl bg-emerald-500/15 border border-emerald-500/30 flex items-center justify-center text-xl shrink-0 font-bold text-emerald-400">
      ⏰
    </div>
    <div class="min-w-0">
      <p class="text-[11px] font-medium text-neutral-400 uppercase tracking-wider">Hoy</p>
      <h3 class="text-xl font-black text-emerald-400 tracking-tight">{{ stats().todayLogs }}</h3>
      <p class="text-[10px] text-neutral-400">Eventos de la fecha</p>
    </div>
  </div>
</div>
