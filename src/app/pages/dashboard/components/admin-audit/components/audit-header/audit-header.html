<div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-neutral-800/80 p-5 rounded-2xl border border-neutral-700/80 shadow-md backdrop-blur-sm my-2">
  <div>
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-[#D4AF37]/15 border border-[#D4AF37]/30 flex items-center justify-center text-xl shrink-0">
        📜
      </div>
      <div>
        <h2 class="text-xl font-black text-white tracking-tight flex items-center gap-2">
          Auditoría & Logs de Actividad
          <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            Supabase Live
          </span>
        </h2>
        <p class="text-xs text-neutral-400 mt-0.5 font-normal">
          Historial inmutable con fecha, hora y usuario que creó funciones, modificó precios, validó boletos QR o gestionó el catálogo.
        </p>
      </div>
    </div>
  </div>

  <div class="flex items-center gap-2.5 self-start md:self-auto">
    <button
      type="button"
      (click)="refresh.emit()"
      [disabled]="isLoading()"
      title="Sincronizar datos con Supabase"
      class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold bg-neutral-900/90 text-neutral-200 border border-neutral-700 hover:border-[#D4AF37]/60 hover:text-[#D4AF37] active:scale-95 transition-all disabled:opacity-50 cursor-pointer shadow-sm">
      <svg
        class="w-3.5 h-3.5"
        [class.animate-spin]="isLoading()"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
      <span>{{ isLoading() ? 'Sincronizando...' : 'Recargar' }}</span>
    </button>

    <button
      type="button"
      (click)="openManualModal.emit()"
      class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold bg-[#D4AF37] text-neutral-950 hover:bg-[#c49f27] active:scale-95 transition-all shadow-md shadow-[#D4AF37]/10 cursor-pointer">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      <span>Registrar Evento</span>
    </button>
  </div>
</div>
