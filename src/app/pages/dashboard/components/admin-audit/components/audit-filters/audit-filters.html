<div class="bg-neutral-800/80 p-4 rounded-2xl border border-neutral-700/80 space-y-3.5">
  <div class="flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-3">
    <!-- Search Bar -->
    <div class="relative flex-1">
      <input
        type="text"
        [ngModel]="searchQuery()"
        (ngModelChange)="searchChange.emit($event)"
        placeholder="Buscar por descripción, usuario, acción o fecha..."
        class="w-full pl-9 pr-8 py-2.5 bg-neutral-900 border border-neutral-700 rounded-xl text-white text-xs placeholder-neutral-500 focus:outline-none focus:border-[#D4AF37] transition-all" />
      <svg class="w-4 h-4 text-neutral-400 absolute left-3 top-3 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      @if (searchQuery()) {
        <button
          type="button"
          (click)="searchChange.emit('')"
          class="absolute right-2.5 top-2.5 text-neutral-400 hover:text-white text-xs cursor-pointer">
          ✕
        </button>
      }
    </div>

    <!-- Dropdown Filters -->
    <div class="flex flex-wrap items-center gap-2.5">
      <!-- Category Filter -->
      <select
        [ngModel]="selectedCategory()"
        (ngModelChange)="categoryChange.emit($event)"
        class="px-3 py-2 bg-neutral-900 border border-neutral-700 rounded-xl text-white text-xs font-semibold focus:outline-none focus:border-[#D4AF37] cursor-pointer">
        @for (cat of categories; track cat.value) {
          <option [value]="cat.value">{{ cat.label }}</option>
        }
      </select>

      <!-- Action Filter -->
      <select
        [ngModel]="selectedAction()"
        (ngModelChange)="actionChange.emit($event)"
        class="px-3 py-2 bg-neutral-900 border border-neutral-700 rounded-xl text-white text-xs font-semibold focus:outline-none focus:border-[#D4AF37] cursor-pointer">
        @for (act of actions; track act.value) {
          <option [value]="act.value">{{ act.label }}</option>
        }
      </select>

      <!-- Role Filter -->
      <select
        [ngModel]="selectedRole()"
        (ngModelChange)="roleChange.emit($event)"
        class="px-3 py-2 bg-neutral-900 border border-neutral-700 rounded-xl text-white text-xs font-semibold focus:outline-none focus:border-[#D4AF37] cursor-pointer">
        @for (r of roles; track r.value) {
          <option [value]="r.value">{{ r.label }}</option>
        }
      </select>

      <!-- Reset Button -->
      @if (selectedCategory() !== 'todos' || selectedAction() !== 'todos' || selectedRole() !== 'todos' || searchQuery() !== '') {
        <button
          type="button"
          (click)="resetFilters.emit()"
          class="px-3 py-2 text-xs font-semibold text-amber-400 hover:text-amber-300 bg-amber-500/10 border border-amber-500/20 rounded-xl cursor-pointer transition-colors">
          Limpiar Filtros
        </button>
      }
    </div>
  </div>

  <!-- Results Count Subtitle -->
  <div class="flex items-center justify-between text-[11px] text-neutral-400 border-t border-neutral-700/50 pt-2 px-1">
    <span>Mostrando <strong class="text-white">{{ resultsCount() }}</strong> registro(s)</span>
    <span>Ordenado por fecha más reciente primero</span>
  </div>
</div>
