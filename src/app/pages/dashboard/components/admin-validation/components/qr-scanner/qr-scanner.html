<div class="bg-neutral-800/90 rounded-2xl border border-neutral-700 p-5 sm:p-6 shadow-lg space-y-4">
  <div class="flex items-center justify-between">
    <h3 class="text-sm font-bold text-white flex items-center gap-2">
      <span class="text-lg">📷</span> Escáner QR de Cámara
    </h3>

    <!-- Switch Camera / Device selection -->
    @if (availableCameras().length > 1) {
      <div class="flex items-center gap-1.5">
        <label for="cameraSelect" class="text-xs text-gray-400">Cámara:</label>
        <select
          id="cameraSelect"
          [value]="selectedCameraId()"
          (change)="onCameraSelect($event)"
          class="bg-neutral-900 border border-neutral-700 text-xs text-gray-200 rounded-lg px-2.5 py-1 focus:outline-none focus:border-[#D4AF37]">
          @for (cam of availableCameras(); track cam.deviceId) {
            <option [value]="cam.deviceId">
              {{ cam.label || 'Cámara ' + ($index + 1) }}
            </option>
          }
        </select>
      </div>
    }
  </div>

  <!-- Camera Viewport Box -->
  <div class="relative w-full max-w-[340px] aspect-square mx-auto rounded-2xl bg-neutral-950 border-2 border-dashed border-[#D4AF37]/80 overflow-hidden flex flex-col items-center justify-center shadow-inner">

    <!-- Active Video Stream -->
    <video
      #videoElement
      autoplay
      playsinline
      muted
      class="w-full h-full object-cover"
      [class.hidden]="!isCameraRunning()">
    </video>

    <!-- Scan overlay viewfinder frame -->
    @if (isCameraRunning()) {
      <div class="absolute inset-0 pointer-events-none flex items-center justify-center">
        <!-- Target Box -->
        <div class="relative w-48 h-48 sm:w-56 sm:h-56 border-2 border-[#D4AF37] rounded-xl bg-[#D4AF37]/5 shadow-[0_0_20px_rgba(212,175,55,0.2)]">
          <!-- Corner brackets -->
          <span class="absolute -top-1 -left-1 w-4 h-4 border-t-4 border-l-4 border-[#D4AF37] rounded-tl"></span>
          <span class="absolute -top-1 -right-1 w-4 h-4 border-t-4 border-r-4 border-[#D4AF37] rounded-tr"></span>
          <span class="absolute -bottom-1 -left-1 w-4 h-4 border-b-4 border-l-4 border-[#D4AF37] rounded-bl"></span>
          <span class="absolute -bottom-1 -right-1 w-4 h-4 border-b-4 border-r-4 border-[#D4AF37] rounded-br"></span>

          <!-- Animated Laser Beam line -->
          <div class="scanner-laser"></div>
        </div>
      </div>
    }

    <!-- Fallback / Camera stopped placeholder -->
    @if (!isCameraRunning()) {
      <div class="p-6 text-center space-y-3">
        <div class="w-16 h-16 rounded-2xl bg-neutral-900 border border-neutral-700 flex items-center justify-center mx-auto text-gray-500">
          <svg class="w-8 h-8 text-[#D4AF37]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </div>
        <p class="text-xs text-gray-400">
          Cámara apagada o no disponible.
        </p>
        <button
          type="button"
          (click)="startCamera()"
          class="px-4 py-2 bg-[#D4AF37] hover:bg-[#b8972e] text-neutral-950 text-xs font-bold rounded-xl shadow cursor-pointer transition">
          Iniciar Cámara
        </button>
      </div>
    }

    <!-- Processing Overlay -->
    @if (isProcessingScan()) {
      <div class="absolute inset-0 bg-neutral-950/80 backdrop-blur-xs flex flex-col items-center justify-center p-4 text-center z-10 animate-fade-in">
        <div class="w-10 h-10 border-3 border-[#D4AF37] border-t-transparent rounded-full animate-spin mb-3"></div>
        <span class="text-xs font-bold text-[#D4AF37] uppercase tracking-wider">Verificando QR en Supabase...</span>
      </div>
    }
  </div>

  <!-- Error feedback message -->
  @if (errorMessage()) {
    <div class="p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs text-center flex items-center justify-between gap-2">
      <span class="flex-1">{{ errorMessage() }}</span>
      <button
        type="button"
        (click)="errorMessage.set(null)"
        class="text-rose-400 hover:text-rose-200 text-sm font-bold">
        ✕
      </button>
    </div>
  }

  <!-- Action Controls -->
  <div class="flex flex-wrap items-center justify-center gap-2 pt-1">
    @if (isCameraRunning()) {
      <button
        type="button"
        (click)="stopCamera()"
        class="px-3.5 py-1.5 bg-neutral-900 hover:bg-neutral-700 text-gray-300 text-xs font-semibold rounded-xl border border-neutral-700 cursor-pointer transition flex items-center gap-1.5">
        <span>⏹️</span> Pausar Cámara
      </button>
    } @else {
      <button
        type="button"
        (click)="startCamera()"
        class="px-3.5 py-1.5 bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 text-xs font-semibold rounded-xl border border-emerald-500/30 cursor-pointer transition flex items-center gap-1.5">
        <span>▶️</span> Activar Cámara
      </button>
    }

    <!-- Image Upload fallback -->
    <input
      #fileInput
      type="file"
      accept="image/*"
      class="hidden"
      (change)="onFileSelected($event)" />

    <button
      type="button"
      (click)="triggerFileInput()"
      class="px-3.5 py-1.5 bg-neutral-900 hover:bg-neutral-700 text-gray-300 text-xs font-semibold rounded-xl border border-neutral-700 cursor-pointer transition flex items-center gap-1.5">
      <span>🖼️</span> Subir Imagen QR
    </button>
  </div>
</div>
