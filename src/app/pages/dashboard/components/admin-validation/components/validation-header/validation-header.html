<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-neutral-800/80 p-5 rounded-2xl border border-neutral-700">
  <div>
    <h2 class="text-xl font-bold text-white flex items-center gap-2">
      <span class="text-[#D4AF37]">📱</span> Validación de Boletos (QR)
    </h2>
    <p class="text-xs text-gray-400 mt-0.5">
      Escaneo mediante cámara en tiempo real e ingreso manual para verificación y admisión a salas.
    </p>
  </div>

  <div class="flex items-center gap-2">
    @if (cameraActive()) {
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 animate-pulse">
        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
        Cámara Activa
      </span>
    } @else {
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-neutral-700/50 text-gray-400 border border-neutral-600">
        <span class="w-2 h-2 rounded-full bg-gray-400"></span>
        Cámara en Espera
      </span>
    }
  </div>
</div>
