@if (isOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 overflow-y-auto">
    <div class="bg-neutral-900 border border-neutral-700 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-5 my-8">

      <!-- Modal Header -->
      <div class="flex items-center justify-between border-b border-neutral-800 pb-3">
        <h3 class="text-lg font-bold text-white flex items-center gap-2">
          <span>{{ coupon() ? '✏️' : '🎟️' }}</span>
          <span>{{ coupon() ? 'Editar Cupón de Descuento' : 'Nuevo Cupón de Descuento' }}</span>
        </h3>
        <button
          type="button"
          (click)="onClose()"
          class="text-gray-400 hover:text-white cursor-pointer text-lg font-bold">
          ✕
        </button>
      </div>

      <!-- Validation Error -->
      @if (validationError()) {
        <div class="p-3 bg-rose-500/10 border border-rose-500/30 rounded-xl text-xs text-rose-300 font-semibold flex items-center gap-2">
          <span>⚠️</span>
          <span>{{ validationError() }}</span>
        </div>
      }

      <!-- Form -->
      <form (ngSubmit)="onSubmit()" class="space-y-4">

        <!-- Coupon Code -->
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">
            Código del Cupón <span class="text-amber-400">*</span>
          </label>
          <input
            type="text"
            [ngModel]="codigo()"
            (ngModelChange)="codigo.set($event)"
            name="codigo"
            placeholder="Ej. VERANO30, ESTUDIANTE15"
            class="w-full px-3.5 py-2.5 bg-neutral-800 border border-neutral-700 rounded-xl text-white uppercase font-mono font-bold text-sm focus:outline-none focus:border-[#D4AF37] focus:ring-1 focus:ring-[#D4AF37]"
            required />
          <p class="text-[11px] text-gray-500 mt-1">El código se convertirá automáticamente a mayúsculas.</p>
        </div>

        <!-- Discount Percentage -->
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">
            Porcentaje de Descuento (%) <span class="text-amber-400">*</span>
          </label>
          <div class="relative">
            <input
              type="number"
              [ngModel]="porcentaje_descuento()"
              (ngModelChange)="porcentaje_descuento.set($event)"
              name="porcentaje_descuento"
              min="1"
              max="100"
              step="0.5"
              placeholder="Ej. 20"
              class="w-full px-3.5 py-2.5 bg-neutral-800 border border-neutral-700 rounded-xl text-white font-bold text-sm focus:outline-none focus:border-[#D4AF37] focus:ring-1 focus:ring-[#D4AF37]"
              required />
            <span class="absolute right-3.5 top-2.5 text-gray-400 font-bold text-sm">%</span>
          </div>
        </div>

        <!-- Restriction Type -->
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">
            Tipo de Restricción / Condición
          </label>
          <select
            [ngModel]="tipo_restriccion()"
            (ngModelChange)="onRestrictionChange($event)"
            name="tipo_restriccion"
            class="w-full px-3.5 py-2.5 bg-neutral-800 border border-neutral-700 rounded-xl text-white text-sm focus:outline-none focus:border-[#D4AF37] focus:ring-1 focus:ring-[#D4AF37] cursor-pointer">
            <option value="Ninguna">Ninguna (Uso general)</option>
            <option value="Primera Compra">Primera Compra (Nuevos registrados)</option>
            <option value="Mayores 50">Mayores 50 (Clientes de 50+ años)</option>
            <option value="Personalizada">Otra / Personalizada</option>
          </select>
        </div>

        <!-- Custom Restriction text if selected -->
        @if (isCustomRestriction()) {
          <div>
            <label class="block text-xs font-semibold text-gray-300 mb-1">
              Nombre de la Restricción <span class="text-amber-400">*</span>
            </label>
            <input
              type="text"
              [ngModel]="customRestriction()"
              (ngModelChange)="customRestriction.set($event)"
              name="customRestriction"
              placeholder="Ej. Estudiantes Universitarios"
              class="w-full px-3.5 py-2.5 bg-neutral-800 border border-neutral-700 rounded-xl text-white text-sm focus:outline-none focus:border-[#D4AF37] focus:ring-1 focus:ring-[#D4AF37]" />
          </div>
        }

        <!-- Actions -->
        <div class="flex items-center justify-end gap-3 pt-3 border-t border-neutral-800">
          <button
            type="button"
            (click)="onClose()"
            [disabled]="isSaving()"
            class="px-4 py-2.5 bg-neutral-800 hover:bg-neutral-700 text-gray-300 text-xs font-bold rounded-xl transition-all cursor-pointer disabled:opacity-50">
            Cancelar
          </button>
          <button
            type="submit"
            [disabled]="isSaving()"
            class="px-5 py-2.5 bg-[#D4AF37] hover:bg-[#b8972e] text-neutral-950 text-xs font-bold rounded-xl shadow-md transition-all cursor-pointer disabled:opacity-50 flex items-center gap-2">
            @if (isSaving()) {
              <span class="inline-block w-3.5 h-3.5 border-2 border-neutral-950 border-t-transparent rounded-full animate-spin"></span>
            }
            <span>{{ isSaving() ? 'Guardando...' : (coupon() ? 'Guardar Cambios' : 'Crear Cupón') }}</span>
          </button>
        </div>

      </form>
    </div>
  </div>
}
