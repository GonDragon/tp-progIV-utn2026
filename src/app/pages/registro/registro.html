<div class="flex flex-col items-center justify-center min-h-[75vh] px-4 py-8">
  <div class="w-full max-w-xl bg-neutral-800 border border-neutral-700/80 rounded-2xl p-6 sm:p-8 shadow-2xl">

    <!-- Header Component -->
    <app-register-header
      [welcomeDiscount]="welcomeDiscount()"
      [welcomeCode]="welcomeCode()">
    </app-register-header>

    <!-- Error Alert Message -->
    @if (errorMessage()) {
      <div class="mb-5 p-3.5 bg-red-950/60 border border-red-500/80 text-red-200 text-sm rounded-xl flex items-center gap-2.5 animate-shake">
        <svg class="w-5 h-5 text-red-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <!-- Main Registration Form -->
    <form (ngSubmit)="onSubmit()" class="space-y-6">

      <!-- Personal Information Form Component -->
      <app-register-personal-form
        [(nombre)]="nombre"
        [(apellido)]="apellido"
        [(fechaNacimiento)]="fechaNacimiento"
        [(tipoSangre)]="tipoSangre"
        [(colorOjos)]="colorOjos"
        [(diasVacaciones)]="diasVacaciones">
      </app-register-personal-form>

      <!-- Account Access Form Component -->
      <app-register-account-form
        [(email)]="email"
        [(password)]="password"
        [(confirmPassword)]="confirmPassword">
      </app-register-account-form>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="isLoading()"
        class="w-full py-3.5 bg-gradient-to-r from-[#D4AF37] to-amber-500 hover:from-[#b8952b] hover:to-amber-600 disabled:opacity-50 disabled:cursor-not-allowed text-neutral-950 font-extrabold rounded-xl shadow-xl transition-all duration-200 cursor-pointer text-base tracking-wide flex items-center justify-center gap-2 mt-6">
        @if (isLoading()) {
          <svg class="animate-spin h-5 w-5 text-neutral-950" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>Registrando cuenta...</span>
        } @else {
          <svg class="w-5 h-5 text-neutral-950" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
          </svg>
          <span>Completar Registro</span>
        }
      </button>
    </form>

    <!-- Footer Switch to Login -->
    <div class="mt-6 pt-5 border-t border-neutral-700/80 text-center">
      <p class="text-sm text-gray-400">
        ¿Ya tenés una cuenta en CineIV?
        <button
          type="button"
          (click)="goToLogin()"
          class="text-[#D4AF37] hover:text-[#f7d666] font-semibold underline underline-offset-4 ml-1 cursor-pointer transition-colors">
          Iniciar Sesión
        </button>
      </p>
    </div>

  </div>
</div>

<!-- Success Modal Component -->
<app-register-success-modal
  [isOpen]="showSuccessModal()"
  [userName]="registeredUserName()"
  [welcomeDiscount]="welcomeDiscount()"
  [welcomeCode]="welcomeCode()"
  (close)="onSuccessModalClose()">
</app-register-success-modal>
