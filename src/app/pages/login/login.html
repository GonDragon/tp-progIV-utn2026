<div class="flex flex-col items-center justify-center min-h-[60vh] px-4 py-8">
  <div class="w-full max-w-md bg-neutral-800 border border-neutral-700 rounded-xl p-8 shadow-2xl">
    <h2 class="text-2xl font-bold text-[#D4AF37] mb-6 text-center">Iniciar Sesión</h2>

    @if (errorMessage()) {
      <div class="mb-4 p-3 bg-red-900/50 border border-red-500 text-red-200 text-sm rounded-lg text-center">
        {{ errorMessage() }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-300 mb-1">Email</label>
        <input
          id="email"
          type="email"
          name="email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          placeholder="ejemplo@correo.com"
          required
          class="w-full px-4 py-2.5 bg-neutral-900 border border-neutral-700 rounded-lg text-gray-100 placeholder-gray-500 focus:outline-none focus:border-[#D4AF37] focus:ring-1 focus:ring-[#D4AF37] transition-colors"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-300 mb-1">Contraseña</label>
        <input
          id="password"
          type="password"
          name="password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          placeholder="••••••••"
          required
          class="w-full px-4 py-2.5 bg-neutral-900 border border-neutral-700 rounded-lg text-gray-100 placeholder-gray-500 focus:outline-none focus:border-[#D4AF37] focus:ring-1 focus:ring-[#D4AF37] transition-colors"
        />
      </div>

      <button
        type="submit"
        [disabled]="isLoading()"
        class="mt-2 w-full py-3 bg-[#D4AF37] hover:bg-[#b8952b] disabled:opacity-50 disabled:cursor-not-allowed text-neutral-950 font-bold rounded-lg shadow-lg transition-all duration-200 cursor-pointer text-base tracking-wide flex items-center justify-center gap-2">
        @if (isLoading()) {
          <svg class="animate-spin h-5 w-5 text-neutral-950" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>Iniciando sesión...</span>
        } @else {
          <span>Iniciar Sesión</span>
        }
      </button>
    </form>

    <div class="mt-6 pt-5 border-t border-neutral-700">
      <p class="text-xs text-gray-400 text-center mb-3 font-medium uppercase tracking-wider">Cuentas de prueba</p>
      <div class="grid grid-cols-3 gap-2">
        <button
          type="button"
          (click)="fillCredentials('admin')"
          class="px-3 py-2 bg-neutral-900 hover:bg-neutral-700 border border-neutral-700 hover:border-[#D4AF37] text-gray-200 text-sm font-semibold rounded-lg transition-colors cursor-pointer text-center">
          Admin
        </button>
        <button
          type="button"
          (click)="fillCredentials('empleado')"
          class="px-3 py-2 bg-neutral-900 hover:bg-neutral-700 border border-neutral-700 hover:border-[#D4AF37] text-gray-200 text-sm font-semibold rounded-lg transition-colors cursor-pointer text-center">
          Empleado
        </button>
        <button
          type="button"
          (click)="fillCredentials('cliente')"
          class="px-3 py-2 bg-neutral-900 hover:bg-neutral-700 border border-neutral-700 hover:border-[#D4AF37] text-gray-200 text-sm font-semibold rounded-lg transition-colors cursor-pointer text-center">
          Cliente
        </button>
      </div>
    </div>
  </div>
</div>
